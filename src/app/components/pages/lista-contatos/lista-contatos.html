<app-container>
  <app-cabecalho></app-cabecalho>

  <!-- Two-Way Data Binding -->
  <input type="search" [(ngModel)]="filtroPorTexto" placeholder="Digite para buscar contato" />

  <section class="adicionar-contato">
    <button routerLink="/formulario">
      <img src="assets/plus.png" alt="add" />
      <span>adicionar contato</span>
    </button>
  </section>

  @for(letra of alfabeto; track letra){
  <!-- faz um loop passando por todas as letras encontradas na string alfabeto -->
  <app-separador>
    {{ letra }}
  </app-separador>
  @for(contato of filtrarPorTextoEPorLetra(letra); track contato.id){
  <app-contato [nome]="contato.nome" [telefone]="contato.telefone"></app-contato>
  } }
</app-container>
