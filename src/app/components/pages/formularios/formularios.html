<app-container>
  <header>
    <section class="cabecalho-link">
      <img src="assets/logo.png" alt="Logo">
    </section>
    <section class="cabecalho-contato">
      <img src="assets/adicionar-contato.png" alt="Contato">
    </section>

    <h1>
      Adicionar Contato
    </h1>
  </header>

  <form [formGroup] = "contatoForm" >
    <label for="nome">Nome:</label>
    <input type="text" id="nome" formControlName="nome" placeholder="Digite o nome do contato">

    <label for="telefone">Telefone:</label>
    <input type="text" id="telefone" formControlName="telefone" placeholder="Digite o telefone do contato">

    <label for="email">Email:</label>
    <input type="email" id="email" formControlName="email" placeholder="Digite o email do contato">

    <app-separador></app-separador>

    <label for="aniversario">Aniversário:</label>
    <input type="date" id="aniversario" formControlName="aniversario" placeholder="Digite o aniversário do contato">

    <label for="redes">Redes:</label>
    <div class="input-container">
      <span class="span-http">http://</span>
      <input type="url" id="redes" formControlName="redes" placeholder="Adicionar a URL da página">
    </div>

    <textarea type="text" id="observacoes" formControlName="observacoes" placeholder='"Coloque observações neste espaço.
Ex.: "Aluna do DTA"'></textarea>

    <section class="botoes">
      <button class="botao-cancelar" type="button">Cancelar</button>
      <button class="botao-salvar" type="button">Salvar contato</button>
    </section>
  </form>
</app-container>
