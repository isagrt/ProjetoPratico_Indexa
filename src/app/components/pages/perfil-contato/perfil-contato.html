<app-container>
  <header>
    <section class="cabecalho-link">
      <img src="assets/logo.png" alt="logo" />
    </section>

    <section class="voltar">
      <button routerLink="/lista">
        <img src="assets/arrow-left.png" alt="add" />
        <span>Voltar</span>
      </button>
    </section>

    <section class="cabecalho-contato">
      <img src="assets/perfil-contato.png" alt="adicionar-contato" />
    </section>

    <h1>Perfil do Contato</h1>
  </header>

  <app-separador></app-separador>

  <form class="formulario">
    <div class="card-usuario">
      <img
        class="imagem-contato"
        [src]="contato?.foto || 'https://ui-avatars.com/api/?name=' + contato?.nome"
      />

      <div class="info-usuario">
        <span class="nome-usuario">{{ contato?.nome }} </span>
      </div>
    </div>

    <app-separador></app-separador>

    <div class="info-container">
      <div class="info-item">
        <span class="material-icons">phone</span>
        <div>
          <strong>Número</strong>
          <input
            [(ngModel)]="contato.telefone"
            name="telefone"
            [disabled]="true"
          />
        </div>
      </div>

      <div class="info-item">
        <span class="material-icons">email</span>
        <div>
          <strong>Email</strong>
          <input
            [(ngModel)]="contato.email"
            name="email"
            [disabled]="true"
          />
        </div>
      </div>

      <div class="info-item">
        <span class="material-icons">calendar_today</span>
        <div>
          <strong>Data de nascimento</strong>
          <input
            [(ngModel)]="contato.dataNascimento"
            name="dataNascimento"
            [disabled]="true"
          />
        </div>
      </div>

      <div class="info-item">
        <span class="material-icons">public</span>
        <div>
          <strong>Redes sociais</strong>
          <input
            [(ngModel)]="contato.redesSociais"
            name="linkedin"
            [disabled]="true"
          />
          <input
            [(ngModel)]="contato.redesSociais"
            name="instagram"
            [disabled]="true"
          />
        </div>
      </div>
    </div>
  </form>
</app-container>
